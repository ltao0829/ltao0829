<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="495" height="195" fill="none" role="img" aria-label="GitHub Streak Stats">
  <style>
    .stat-number { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 28px; font-weight: 700; fill: #3B82F6; text-anchor: middle; }
    .side-number { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 28px; font-weight: 700; fill: #94A3B8; text-anchor: middle; }
    .stat-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #3B82F6; text-anchor: middle; }
    .side-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #94A3B8; text-anchor: middle; }
    .stat-date { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #94A3B8; text-anchor: middle; }
    .ring { stroke: #3B82F6; stroke-width: 4; stroke-linecap: round; }
    .divider { stroke: #334155; stroke-dasharray: 2; stroke-width: 1; }
  </style>

  <!-- Left: Total Contributions -->
  <g transform="translate(82.5, 0)">
    <text x="0" y="70" class="side-number">77</text>
    <text x="0" y="105" class="side-label">Total Contributions</text>
    <text x="0" y="130" class="stat-date">Sep 14, 2025 - Present</text>
  </g>

  <!-- Divider 1 -->
  <line x1="165" y1="40" x2="165" y2="155" class="divider" />

  <!-- Center: Current Streak -->
  <g transform="translate(247.5, 0)">
    <!-- Fire Ring -->
    <circle cx="0" cy="58" r="42" stroke="#1E293B" stroke-width="4" fill="none" />
    <circle cx="0" cy="58" r="42" class="ring" stroke-dasharray="264" stroke-dashoffset="264" transform="rotate(-90 0 58)" />
    <!-- Fire Icon -->
    <path d="M-6,44 C-10,50 -10,56 -4,60 C-2,61 -1,62 -1,64 C-1,66 -3,68 -5,67 C-2,72 5,72 7,67 C9,62 8,58 3,55 C1,54 0,53 1,51 C3,48 4,46 1,42 C-2,44 -4,43 -6,44 Z" fill="#3B82F6" transform="scale(0.8) translate(-1, -6)" />
    
    <text x="0" y="68" class="stat-number">0</text>
    <text x="0" y="125" class="stat-label">Current Streak</text>
    <text x="0" y="148" class="stat-date">No current streak</text>
  </g>

  <!-- Divider 2 -->
  <line x1="330" y1="40" x2="330" y2="155" class="divider" />

  <!-- Right: Longest Streak -->
  <g transform="translate(412.5, 0)">
    <text x="0" y="70" class="side-number">3</text>
    <text x="0" y="105" class="side-label">Longest Streak</text>
    <text x="0" y="130" class="stat-date">May 13 - May 15</text>
  </g>
</svg>